<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- The pointer hotspot is exactly at the center of the crosshair (24,24).
       Because this is a native CSS cursor, the halo and crosshair move together
       with the system pointer, rather than waiting for an animation frame. -->
  <g fill="none" stroke-linecap="round">
    <path d="M24 10V38M10 24H38" stroke="#3bbdff" stroke-opacity=".17" stroke-width="13"/>
    <path d="M24 10V38M10 24H38" stroke="#71d9ff" stroke-opacity=".32" stroke-width="8"/>
    <path d="M24 10V38M10 24H38" stroke="#ffffff" stroke-opacity=".37" stroke-width="5.5"/>
    <path d="M24 10V38M10 24H38" stroke="#08283e" stroke-width="4"/>
    <path d="M24 10V38M10 24H38" stroke="#ffffff" stroke-width="2.2"/>
  </g>
  <circle cx="24" cy="24" r="3.6" fill="#07283b"/>
  <circle cx="24" cy="24" r="1.5" fill="#ffffff"/>
</svg>
